[package]
name = "verifier_contract"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = { version = "21.5.0", features = ["contracts"] }
ark-bn254 = "0.4"
ark-groth16 = "0.4"
ark-std = { version = "0.4", default-features = false, features = ["alloc"] }
ark-ff = "0.4"
ark-ec = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
